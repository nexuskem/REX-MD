name: REX-MD Keep-Alive Runner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # safety net if the self-redispatch chain ever breaks

# Prevent two jobs from running simultaneously — they would fight over the same
# WhatsApp session stored in MongoDB and corrupt it.
concurrency:
  group: rexmd-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # stay under GitHub's hard 360-minute job cap

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Kick off the next run ~5.5 hours from now — before this job's timeout.
      # Uses a classic PAT (GH_PAT) with repo+workflow scope because
      # secrets.GITHUB_TOKEN cannot reliably trigger new workflow runs.
      - name: Schedule next run before this one ends
        run: |
          (
            sleep $((330 * 60))
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/keepalive.yml/dispatches \
              -d '{"ref":"main"}'
          ) &

      - name: Start REX-MD
        env:
          MONGODB_URI:          ${{ secrets.MONGODB_URI }}
          OWNER_NUMBER:         ${{ secrets.OWNER_NUMBER }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          OPENWEATHER_API_KEY:  ${{ secrets.OPENWEATHER_API_KEY }}
          BOT_NAME:             ${{ secrets.BOT_NAME }}
          PREFIX:               ${{ secrets.PREFIX }}
          MAX_DOWNLOAD_MB:      ${{ secrets.MAX_DOWNLOAD_MB }}
          LOG_LEVEL:            info
          # Pairing code requires an interactive TTY — GitHub Actions has none.
          # Pair once locally, let the session persist to MongoDB, then deploy here.
          USE_PAIRING_CODE:     "false"
        run: node index.js
